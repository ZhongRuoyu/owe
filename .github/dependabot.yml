version: 2

updates:
  - package-ecosystem: docker
    directory: /
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docker:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: uv
    directory: /
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      uv:
        patterns:
          - "*"
        # uv-build has no locked version. Grouping its requirement update with
        # lockfile-only updates can make Dependabot discard the entire group.
        # https://github.com/dependabot/dependabot-core/issues/16431#issuecomment-6688702514
        exclude-patterns:
          - "uv-build"
